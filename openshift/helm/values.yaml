---
# Default chart values. Put private deployment overrides into secrets.yaml.

project: copr-dev
create_project: false
# Use prod for production; other deployments use the devel frontend environment.
deployment: dev
devel: true
rpm_vendor_copr_name: Copr

postgres_user: copr-fe
postgres_password: ""
postgres_database_name: copr-db

frontend_backend_password: ""
# Required: a persistent random frontend session/CSRF secret.
frontend_secret_key: ""

frontend_base_url: http://copr-frontend:5000
distgit_fqdn: copr-distgit
backend_fqdn: copr-backend
resalloc_webui_fqdn: ""

redis_host: "redis"
redis_port: 6379
redis_password: ""

postgresql_image: quay.io/sclorg/postgresql-18-c10s
redis_image: quay.io/sclorg/redis-7-c9s
copr_frontend_image: quay.io/copr/frontend:test
copr_backend_image: quay.io/copr/backend:test
nginx_image: quay.io/sclorg/nginx-126-c10s
copr_distgit_image: quay.io/copr/distgit:test
resalloc_image: quay.io/copr/resalloc:test
resalloc_pools_configmap: resalloc-pools
aws_profile: default
aws_region: us-east-1
copr_keygen_image: quay.io/copr/keygen:test

image_pull_policy: Always

# Top-level aliases for AppSRE secretParameters (names cannot contain dots)
aws_access_key_id: ""
aws_secret_access_key: ""
aws_ssh_private_key: ""
aws_ssh_public_key: ""

aws_config:
  access_key_id: ""
  secret_access_key: ""
  # Runtime Secret mounts only; neither backend nor resalloc images contain keys.
  ssh_key:
    name: ""
    private: ""
    public: ""

# Conservative defaults, sized for a small stage/dev deployment.
# Override per-environment via a values file.
resources:
  backend:
    log: &small_app
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    actions: *small_app
    builds: *small_app
    httpd: *small_app

  frontend:
    app: &medium_app
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  distgit:
    imports: *medium_app
    httpd: *small_app

  keygen:
    signer: *small_app
    httpd: *small_app

  resalloc:
    app: *small_app
    webui: *small_app

  postgres:
    app: *medium_app

  redis:
    app: *small_app
