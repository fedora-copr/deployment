# vi: ft=yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-keygen-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-keygen-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: copr-keygen
spec:
  ports:
    - name: copr-keygen-httpd
      port: 5003
      targetPort: 5003
    - name: copr-keygen-signd
      port: 5167
      targetPort: 5167
  selector:
    name: copr-keygen

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-keygen
  labels:
    app: copr
    component: keygen
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: copr-keygen
  template:
    metadata:
      labels:
        name: copr-keygen
        app: copr
        component: keygen
    spec:
      containers:
        - name: signer
          image: {{ .Values.copr_keygen_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          resources:
{{ toYaml .Values.resources.keygen.signer | indent 12 }}
          command: ["/usr/bin/tini", "--"]
          args: ["/signd-entrypoint", "0.0.0.0/0"]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/copr-keygen
            - name: logs
              mountPath: /var/log/copr-keygen
          ports:
            - containerPort: 5167
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 5167
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5167
            initialDelaySeconds: 15
            periodSeconds: 30

        - name: httpd
          image: {{ .Values.copr_keygen_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          resources:
{{ toYaml .Values.resources.keygen.httpd | indent 12 }}
          command: ["/usr/sbin/httpd", "-DFOREGROUND"]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/copr-keygen
            - name: logs
              mountPath: /var/log/copr-keygen
          ports:
            - containerPort: 5003
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 30

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: copr-keygen-data
        - name: logs
          persistentVolumeClaim:
            claimName: copr-keygen-logs

      restartPolicy: Always
