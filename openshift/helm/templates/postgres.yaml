---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql
type: Opaque
stringData:
  database-password: {{ .Values.postgres_password | quote }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql
data:
  database-user: {{ .Values.postgres_user | quote }}
  database-name: {{ .Values.postgres_database_name | quote }}

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    name: postgresql

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ ternary "12Gi" "1Gi" (eq .Values.deployment "prod") | quote }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app: copr
    component: postgres
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: postgresql
  template:
    metadata:
      labels:
        name: postgresql
        test: test-postgresql-tag
        app: copr
        component: postgres
    spec:
      containers:
        - env:
            - name: POSTGRESQL_USER
              valueFrom:
                configMapKeyRef:
                  key: database-user
                  name: postgresql
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: database-password
                  name: postgresql
            - name: POSTGRESQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  key: database-name
                  name: postgresql
          image: {{ required "postgresql_image is required" .Values.postgresql_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          startupProbe:
            exec:
              command:
                - /usr/libexec/check-container
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 120
            timeoutSeconds: 10
          name: postgresql
          ports:
            - containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 5
            timeoutSeconds: 1
          resources:
{{ toYaml .Values.resources.postgres.app | indent 12 }}
          volumeMounts:
            - mountPath: /var/lib/pgsql/data
              name: postgresql-data
      restartPolicy: Always
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql
