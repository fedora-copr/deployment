# vim: ft=yaml

---
apiVersion: v1
kind: Secret
metadata:
  name: copr-frontend-config
type: Opaque
stringData:
  copr.conf: |
{{ tpl (.Files.Get "config/frontend-copr.conf") . | indent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: copr-frontend
spec:
  ports:
    - name: copr-frontend-httpd
      port: 5000
      targetPort: 5000
  selector:
    name: copr-frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-frontend
  labels:
    app: copr
    component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: copr-frontend
  template:
    metadata:
      labels:
        name: copr-frontend
        app: copr
        component: frontend
    spec:
      containers:
        - name: copr-frontend
          image: {{ .Values.copr_frontend_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
{{ toYaml .Values.resources.frontend.app | indent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: 5000
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: copr-frontend-config
              mountPath: /etc/copr
              readOnly: true
      volumes:
        - name: copr-frontend-config
          secret:
            secretName: copr-frontend-config
            optional: false

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: copr-frontend
spec:
  port:
    targetPort: copr-frontend-httpd
  to:
    kind: Service
    name: copr-frontend
