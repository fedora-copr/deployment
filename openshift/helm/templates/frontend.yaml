# vim: ft=yaml

---
apiVersion: v1
kind: Secret
metadata:
  name: copr-frontend-config
type: Opaque
stringData:
  copr.conf: |
{{ tpl (.Files.Get "config/frontend-copr.conf") . | indent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: copr-frontend
spec:
  ports:
    - name: copr-frontend-httpd
      port: 5000
      targetPort: 5000
  selector:
    name: copr-frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-frontend
  labels:
    app: copr
    component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: copr-frontend
  template:
    metadata:
      labels:
        name: copr-frontend
        app: copr
        component: frontend
    spec:
      initContainers:
        - name: wait-postgres
          image: {{ .Values.copr_frontend_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          command:
            - bash
            - -ec
            - |
              for attempt in {1..60}; do
                if pg_isready -h postgresql -p {{ .Values.postgres_port }}; then
                  exit 0
                fi
                echo 'waiting for PostgreSQL'
                sleep 2
              done
              echo 'PostgreSQL not ready' >&2
              exit 1
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
{{- if eq .Values.redis_host "redis" }}
        - name: wait-redis
          image: {{ .Values.copr_frontend_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          command:
            - bash
            - -ec
            - |
              for attempt in {1..60}; do
                if redis-cli -h redis -p {{ .Values.redis_port }} ping | grep -q PONG; then
                  exit 0
                fi
                echo 'waiting for Redis'
                sleep 2
              done
              echo 'Redis not ready' >&2
              exit 1
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
{{- end }}
        - name: init-db
          image: {{ .Values.copr_frontend_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          workingDir: /usr/share/copr/coprs_frontend
          command: ["./manage.py", "create-db", "--alembic", "alembic.ini"]
          volumeMounts:
            - name: copr-frontend-config
              mountPath: /etc/copr
              readOnly: true
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
      containers:
        - name: copr-frontend
          image: {{ .Values.copr_frontend_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          command: ["/usr/sbin/httpd", "-DFOREGROUND"]
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
{{ toYaml .Values.resources.frontend.app | indent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: 5000
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: copr-frontend-config
              mountPath: /etc/copr
              readOnly: true
      volumes:
        - name: copr-frontend-config
          secret:
            secretName: copr-frontend-config
            optional: false

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: copr-frontend
spec:
  port:
    targetPort: copr-frontend-httpd
  to:
    kind: Service
    name: copr-frontend
