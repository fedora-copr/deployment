---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resalloc-config
data:
  server.yaml: |
{{ tpl (.Files.Get "config/resalloc-server.yaml.j2") . | indent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resalloc-provision
data:
{{- range $path, $_ := .Files.Glob "files/provision/**" }}
{{- $rel := trimPrefix "files/provision/" $path }}
  {{ $rel | replace "/" "__" }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: builder-provision-overlays
data:
  rpmbuild-main.ini: |
{{ tpl (.Files.Get "config/builder-rpmbuild-main.ini.j2") . | indent 4 }}
  buildsys.pub: |
{{ tpl (.Files.Get "config/builder-buildsys.pub.j2") . | indent 4 }}
  vars.yml: |
{{ tpl (.Files.Get "config/builder-provision-vars.yml.j2") . | indent 4 }}

---
apiVersion: v1
kind: Secret
metadata:
  name: resalloc-home
type: Opaque
data:
  aws_config: {{ printf "[%s]\nregion = %s\n" (.Values.aws_profile | default "default") (.Values.aws_region | default "us-east-1") | b64enc | quote }}
  aws_credentials: {{ tpl (.Files.Get "config/resalloc-aws-credentials.j2") . | b64enc | quote }}
  id_rsa: {{ coalesce .Values.aws_ssh_private_key .Values.aws_config.ssh_key.private | toString | b64enc | quote }}
  id_rsa.pub: {{ coalesce .Values.aws_ssh_public_key .Values.aws_config.ssh_key.public | toString | b64enc | quote }}
  ssh_config: {{ .Files.Get "config/resalloc-ssh-config" | b64enc | quote }}
  ansible_conf: {{ "[defaults]\nlocal_tmp=/tmp/.ansible\n[ssh_connection]\ncontrol_path_dir=/tmp/.ansible\n" | b64enc | quote }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resalloc-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: resalloc
spec:
  ports:
    - name: resalloc
      port: 49100
      targetPort: 49100
    - name: webui
      port: 5007
      targetPort: 5007
  selector:
    name: resalloc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resalloc
  labels:
    app: copr
    component: resalloc
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: resalloc
  template:
    metadata:
      labels:
        name: resalloc
        app: copr
        component: resalloc
    spec:
      initContainers:
        - name: sync-provision
          image: {{ .Values.resalloc_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              # Base: openshift/helm/files/provision → ConfigMap resalloc-provision
              for src in /provision-src/*; do
                [ -e "$src" ] || continue
                key=$(basename "$src")
                rel=${key//__//}
                mkdir -p "/dest/$(dirname "$rel")"
                cp "$src" "/dest/$rel"
              done
              # Builder provision overlays (templated in helm)
              mkdir -p /dest/files
              cp /overlays/rpmbuild-main.ini /dest/files/main.ini
              cp /overlays/buildsys.pub /dest/files/buildsys.pub
              cp /overlays/vars.yml /dest/vars.yml
              test -f /dest/builderpb-aws.yml
              test -f /dest/files/main.ini
              test -f /dest/files/buildsys.pub
              test -f /dest/vars.yml

          volumeMounts:
            - name: provision-tree
              mountPath: /dest
            - name: provision-src
              mountPath: /provision-src
              readOnly: true
            - name: builder-overlays
              mountPath: /overlays
              readOnly: true

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: server
          image: {{ .Values.resalloc_image }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          ports:
            - containerPort: 49100
              protocol: TCP
          resources:
{{ toYaml .Values.resources.resalloc.app | indent 12 }}
          volumeMounts:
            - name: resalloc-data
              mountPath: /var/lib/resallocserver
            - name: resalloc-logs
              mountPath: /var/log/resallocserver
            - name: resalloc-config
              mountPath: /etc/resallocserver
            - name: provision-tree
              mountPath: /var/lib/resallocserver/provision
            - name: resalloc-home
              mountPath: /resalloc-home
              readOnly: true
          env:
            - name: CONFIG_DIR
              value: /etc/resallocserver
            - name: HOME
              value: /resalloc-home
          command: ["/usr/bin/resalloc-server"]
          readinessProbe:
            tcpSocket:
              port: 49100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 49100
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5

        - name: resalloc-webui
          image: {{ .Values.resalloc_image }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          resources:
{{ toYaml .Values.resources.resalloc.webui | indent 12 }}
          volumeMounts:
            - name: resalloc-data
              mountPath: /var/lib/resallocserver
            - name: resalloc-logs
              mountPath: /var/log/resallocserver
            - name: resalloc-config
              mountPath: /etc/resallocserver
          env:
            - name: CONFIG_DIR
              value: /etc/resallocserver
          command:
            - python3
            - "-c"
            - "from resallocwebui.app import app; app.run(host='0.0.0.0', port=5007)"
          ports:
            - containerPort: 5007
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 5007
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5007
            initialDelaySeconds: 10
            periodSeconds: 30

      volumes:
        - name: resalloc-config
          projected:
            sources:
              - configMap:
                  name: resalloc-config
              - configMap:
                  name: {{ .Values.resalloc_pools_configmap | quote }}
                  items:
                    - key: pools.yaml
                      path: pools.yaml
        - name: provision-tree
          emptyDir: {}
        - name: provision-src
          configMap:
            name: resalloc-provision
        - name: builder-overlays
          configMap:
            name: builder-provision-overlays

        - name: resalloc-home
          secret:
            secretName: resalloc-home
            defaultMode: 0600
            items:
              - key: aws_config
                path: .aws/config
              - key: aws_credentials
                path: .aws/credentials
              - key: id_rsa
                path: .ssh/id_rsa
              # id_rsa.pub optional — not in Vault yet; builders get pubkey via
              # overlay files/buildsys.pub once aws_config.ssh_key.public is set.
              - key: ssh_config
                path: .ssh/config
              - key: ansible_conf
                path: .ansible.cfg

        - name: resalloc-data
          persistentVolumeClaim:
            claimName: resalloc-data
        - name: resalloc-logs
          emptyDir: {}

      restartPolicy: Always

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: copr-resalloc
spec:
  {{- if .Values.resalloc_webui_fqdn }}
  host: {{ .Values.resalloc_webui_fqdn | quote }}
  {{- end }}
  port:
    targetPort: webui
  to:
    kind: Service
    name: resalloc

# vim: ft=yaml
