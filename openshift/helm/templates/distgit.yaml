# vi: ft=yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-distgit-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "3Gi"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-distgit-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "1Gi"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copr-distgit-locks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "10M"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: distgit-config
data:
  dist-git.conf: |
{{ tpl (.Files.Get "config/distgit-distgit.conf.j2") . | indent 4 }}

---
apiVersion: v1
kind: Secret
metadata:
  name: distgit-copr-config
type: Opaque
stringData:
  copr-dist-git.conf: |
{{ tpl (.Files.Get "config/distgit-copr.conf.j2") . | indent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: copr-distgit
spec:
  ports:
    - name: copr-distgit-http
      port: 5001
      targetPort: 5001
  selector:
    name: copr-distgit

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copr-distgit
  labels:
    app: copr
    component: distgit
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: copr-distgit
  template:
    metadata:
      labels:
        name: copr-distgit
        app: copr
        component: distgit
    spec:
      containers:
        - name: imports
          image: {{ .Values.copr_distgit_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          resources:
{{ toYaml .Values.resources.distgit.imports | indent 12 }}
          volumeMounts:
            - name: distgit-copr-config
              mountPath: /etc/copr
              readOnly: true
            - name: distgit-config
              mountPath: /etc/dist-git
            - name: storage
              mountPath: /var/lib/dist-git
            - name: logs
              mountPath: /var/lib/copr-dist-git
            - name: logs
              mountPath: /var/log/copr-dist-git
            - name: locks
              mountPath: /var/lock/copr-dist-git

        - name: httpd
          image: {{ .Values.copr_distgit_image | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          resources:
{{ toYaml .Values.resources.distgit.httpd | indent 12 }}
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: distgit-copr-config
              mountPath: /etc/copr
              readOnly: true
            - name: distgit-config
              mountPath: /etc/dist-git
            - name: storage
              mountPath: /var/lib/dist-git
            - name: logs
              mountPath: /var/lib/copr-dist-git
            - name: logs
              mountPath: /var/log/copr-dist-git
            - name: logs
              mountPath: /var/log/httpd
          command: ["/usr/sbin/httpd", "-DFOREGROUND"]

      volumes:
        - name: distgit-config
          configMap:
            name: distgit-config

        - name: distgit-copr-config
          secret:
            secretName: distgit-copr-config

        - name: storage
          persistentVolumeClaim:
            claimName: copr-distgit-data

        - name: logs
          persistentVolumeClaim:
            claimName: copr-distgit-logs

        - name: locks
          persistentVolumeClaim:
            claimName: copr-distgit-locks

      restartPolicy: Always

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: copr-distgit
spec:
  port:
    targetPort: copr-distgit-http
  to:
    kind: Service
    name: copr-distgit
